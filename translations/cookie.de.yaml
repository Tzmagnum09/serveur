    about:
      what_are:
        title: "Was sind Cookies?"
        description: "Cookies sind kleine Textdateien, die auf Ihrem Computer oder mobilen Gerät gespeichert werden, wenn Sie eine Website besuchen. Sie ermöglichen es der Website, Ihre Aktionen und Einstellungen für einen bestimmten Zeitraum zu speichern, damit Sie diese nicht bei jedem Besuch oder Seitenwechsel erneut eingeben müssen."
      how_used:
