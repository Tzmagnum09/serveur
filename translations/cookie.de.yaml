        description: "Wir verwenden verschiedene Arten von Cookies, um unsere Website funktionsfähig zu machen, Ihre Benutzererfahrung zu verbessern, zu analysieren, wie die Seite genutzt wird, und um die Inhalte und Werbung, die Sie sehen, zu personalisieren."
      how_manage:
        title: "Wie verwalten Sie Cookies?"
        description: "Sie können Ihre Cookie-Einstellungen jederzeit verwalten, indem Sie auf den Link 'Cookie-Einstellungen' am unteren Rand unserer Website klicken. Außerdem können Sie die Einstellungen Ihres Browsers ändern, um bestimmte Cookies zu löschen oder ihre Speicherung ohne Ihre ausdrückliche Zustimmung zu verhindern."
