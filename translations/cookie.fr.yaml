# Bannière principale
cookie:
  banner:
    title: "Ce site web utilise des cookies"
    content: "En tant que visiteur de notre site, nous essayons de vous offrir une expérience aussi agréable que possible. Nous utilisons des cookies en premier lieu pour améliorer votre expérience utilisateur et pour améliorer le fonctionnement de nos services en ligne. En outre, nous utilisons des cookies pour rendre le contenu de nos sites web et applications (mobiles) plus intéressant pour vous. Nous utilisons également des cookies pour cartographier votre comportement de navigation. Comment vous êtes-vous retrouvé sur notre site ? Combien de temps l'avez-vous utilisé ? Grâce aux résultats, nous pouvons améliorer nos sites web si nécessaire et répondre aux préférences et aux besoins de vous et de tous nos autres utilisateurs. Enfin, nous pouvons utiliser ces données pour remplir certaines obligations de déclaration."
    customize: "Personnaliser"
    necessary_only: "Uniquement nécessaire"
    accept_all: "Autoriser et continuer"

  # Modal des préférences
  modal:
    title: "Préférences de cookies"
    necessary_only: "Uniquement nécessaire"
    accept_all: "Tout autoriser"
    save: "Enregistrer les préférences"
    
    # Onglets
    tab:
      overview: "Vue d'ensemble"
      details: "Détails"
      about: "À propos"
    
    # Contenu de l'onglet Vue d'ensemble
    overview:
      intro: "Vous pouvez choisir quels cookies vous souhaitez accepter. Les cookies nécessaires sont obligatoires pour le bon fonctionnement du site."
      necessary:
        title: "Cookies nécessaires"
        description: "Ces cookies sont essentiels pour le fonctionnement de base du site web et ne peuvent pas être désactivés."
      preferences:
        title: "Cookies de préférences"
        description: "Ces cookies permettent de mémoriser vos choix et préférences, comme la langue préférée ou la région où vous vous trouvez."
      statistics:
        title: "Cookies statistiques"
        description: "Ces cookies nous aident à comprendre comment les visiteurs interagissent avec notre site web en recueillant et rapportant des informations de manière anonyme."
      marketing:
        title: "Cookies marketing"
        description: "Ces cookies sont utilisés pour suivre les visiteurs sur les sites web. Ils permettent d'afficher des publicités pertinentes et engageantes pour l'utilisateur."
    
    # Contenu de l'onglet Détails
    details:
      necessary:
        title: "Cookies nécessaires"
        description: "Les cookies nécessaires aident à rendre un site web utilisable en activant des fonctions de base comme la navigation de page et l'accès aux zones sécurisées du site web. Le site web ne peut pas fonctionner correctement sans ces cookies."
        session: "Maintien de la session utilisateur"
        session_end: "Fin de session"
        consent: "Stockage des préférences de consentement aux cookies"
        year: "an"
      preferences:
        title: "Cookies de préférences"
        description: "Les cookies de préférences permettent à un site web de mémoriser des informations qui modifient la manière dont le site se comporte ou s'affiche, comme votre langue préférée ou la région dans laquelle vous vous trouvez."
        language: "Stockage de la préférence de langue"
      statistics:
        title: "Cookies statistiques"
        description: "Les cookies statistiques aident les propriétaires du site web à comprendre comment les visiteurs interagissent avec le site en recueillant et en transmettant des informations de manière anonyme."
        analytics: "Suivi du comportement des utilisateurs sur le site pour améliorer l'expérience"
        user_id: "Distinction des utilisateurs"
        years: "ans"
        hours: "heures"
      marketing:
        title: "Cookies marketing"
        description: "Les cookies marketing sont utilisés pour suivre les visiteurs sur les sites web. Le but est d'afficher des publicités qui sont pertinentes et intéressantes pour l'utilisateur individuel et donc plus précieuses pour les éditeurs et annonceurs tiers."
        facebook: "Suivi des conversions publicitaires et retargeting"
        months: "mois"
      table:
        name: "Nom"
        provider: "Fournisseur"
        purpose: "Finalité"
        expiry: "Expiration"
    
    # Contenu de l'onglet À propos
    about:
      what_are:
        title: "Que sont les cookies ?"
        description: "Les cookies sont de petits fichiers texte qui sont stockés sur votre ordinateur ou appareil mobile lorsque vous visitez un site web. Ils permettent au site de mémoriser vos actions et préférences pendant une période déterminée, afin que vous n'ayez pas à les ressaisir à chaque fois que vous visitez le site ou naviguez d'une page à une autre."
      how_used:
        title: "Comment utilisons-nous les cookies ?"
        description: "Nous utilisons différents types de cookies pour faire fonctionner notre site, améliorer votre expérience utilisateur, analyser comment le site est utilisé et personnaliser le contenu et les publicités que vous voyez."
      how_manage:
        title: "Comment gérer les cookies ?"
        description: "Vous pouvez gérer vos préférences de cookies à tout moment en cliquant sur le lien 'Paramètres des cookies' en bas de notre site. Vous pouvez également modifier les paramètres de votre navigateur pour supprimer ou empêcher certains cookies d'être stockés sur votre ordinateur ou appareil mobile sans votre consentement explicite."
      more_info:
        title: "Plus d'informations"
        description: "Pour en savoir plus sur notre utilisation des cookies, veuillez consulter notre politique de confidentialité et nos conditions d'utilisation sur"
        terms_link: "notre page des conditions d'utilisation"

  # Lien dans le footer
  footer:
