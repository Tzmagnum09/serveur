# Bannière principale
cookie:
  banner:
    title: "Deze website maakt gebruik van cookies"
    content: "Als bezoeker van onze website proberen wij u een zo aangenaam mogelijke ervaring te bieden. Wij gebruiken cookies in de eerste plaats om uw gebruikerservaring te verbeteren en de werking van onze online diensten te optimaliseren. Bovendien gebruiken wij cookies om de inhoud van onze websites en (mobiele) applicaties interessanter voor u te maken. We gebruiken ook cookies om uw surfgedrag in kaart te brengen. Hoe bent u op onze site terechtgekomen? Hoe lang heeft u het gebruikt? Dankzij de resultaten kunnen we onze websites, indien nodig, verbeteren en inspelen op de voorkeuren en behoeften van u en al onze andere gebruikers."
