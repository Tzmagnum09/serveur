    # Contenu de l'onglet À propos
    about:
      what_are:
        title: "Wat zijn cookies?"
        description: "Cookies zijn kleine tekstbestanden die op uw computer of mobiele apparaat worden opgeslagen wanneer u een website bezoekt. Ze stellen de site in staat om uw handelingen en voorkeuren gedurende een bepaalde periode te onthouden, zodat u deze niet elke keer opnieuw hoeft in te voeren wanneer u de site bezoekt of van pagina wisselt."
      how_used:
        title: "Hoe gebruiken wij cookies?"
        description: "Wij gebruiken verschillende typen cookies om onze website te laten functioneren, uw gebruikerservaring te verbeteren, te analyseren hoe de site wordt gebruikt en de inhoud en advertenties die u ziet te personaliseren."
      how_manage:
        title: "Hoe beheert u cookies?"
        description: "U kunt uw cookievoorkeuren op elk moment aanpassen door op de link 'Cookie-instellingen' onderaan onze site te klikken. U kunt ook de instellingen van uw browser aanpassen om bepaalde cookies te verwijderen of te blokkeren zonder uw expliciete toestemming."
      more_info:
        title: "Meer informatie"
        description: "Voor meer informatie over ons gebruik van cookies, raadpleegt u ons privacybeleid en de gebruiksvoorwaarden op"
        terms_link: "onze pagina met gebruiksvoorwaarden"

