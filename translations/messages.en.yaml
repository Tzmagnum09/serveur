# Terms of Service
terms:
    title: "Terms of Service"
    introduction:
        title: "Introduction"
        content: "Welcome to DMQode.be. These terms of service govern your use of our website and services. By registering on our site, you agree to be bound by these terms. Please read them carefully."
    definitions:
        title: "Definitions"
        service: "\"Service\" refers to the DMQode.be website"
        user: "\"User\" refers to any person who accesses the Service and creates an account"
        account: "\"Account\" refers to personalized access to the Service"
    registration:
        title: "Registration and Account"
        content1: "To use certain features of the Service, you must create an account. When registering, you agree to provide accurate, current, and complete information. You are responsible for the confidentiality of your password and for all activities that occur under your account."
        content2: "After registering, you will need to verify your email address. Then, an administrator will need to approve your account before you can access all features of the service."
    rights:
        title: "Rights and Responsibilities"
        content: "When using our Service, you agree not to:"
        item1: "Violate applicable laws"
        item2: "Distribute viruses or any other malicious code"
        item3: "Disrupt or interfere with the security of the Service"
        item4: "Collect information about other users without their consent"
        item5: "Use the Service in a way that could damage, disable, overburden, or impair the Service"
    data_protection:
        title: "Personal Data Protection"
        content1: "We respect your privacy and protect your personal data in accordance with our privacy policy and applicable laws, including the General Data Protection Regulation (GDPR)."
        content2: "The personal data you provide during registration is used only for providing our services and will not be shared with third parties without your explicit consent."
    changes:
        title: "Changes to Terms of Service"
        content: "We reserve the right to modify these terms of service at any time. Changes take effect immediately upon posting on the Service. It is your responsibility to regularly review these terms."
    termination:
        title: "Termination"
        content: "We reserve the right to suspend or terminate your account and access to the Service at our sole discretion, without notice, for conduct that we deem contrary to these terms of service or any applicable law."
    contact:
        title: "Contact"
        content: "If you have any questions regarding these terms of service, please contact us at: contact@dmqode.be"
    footer:
        last_update: "Last updated:"
    back_btn: "Back to registration"