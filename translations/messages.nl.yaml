    content: "Als bezoeker van onze website proberen wij u een zo aangenaam mogelijke ervaring te bieden. Wij gebruiken cookies in de eerste plaats om uw gebruikerservaring te verbeteren en de werking van onze online diensten te optimaliseren. Bovendien gebruiken wij cookies om de inhoud van onze websites en (mobiele) applicaties interessanter voor u te maken. We gebruiken ook cookies om uw surfgedrag in kaart te brengen."
    customize: "Aanpassen"
    necessary_only: "Alleen noodzakelijk"
    accept_all: "Accepteren en doorgaan"

